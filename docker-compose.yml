version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: pdf-ingest-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  pdf-ingest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf-ingest-app
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./documents:/app/documents
    environment:
      - OLLAMA_URL=http://ollama:11434
      - VECTOR_STORE_PATH=/app/data/vector_store
      - PYTHONPATH=/app/src
    depends_on:
      - ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Optional: FastAPI backend for API access
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: pdf-ingest-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - OLLAMA_URL=http://ollama:11434
      - VECTOR_STORE_PATH=/app/data/vector_store
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data: