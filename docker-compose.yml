version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: pdf-ingest-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
        limits:
          memory: 8G
          cpus: '4'
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run

  pdf-ingest:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: pdf-ingest-app
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./documents:/app/documents
    environment:
      - OLLAMA_URL=http://ollama:11434
      - VECTOR_STORE_PATH=/app/data/vector_store
      - PYTHONPATH=/app/src
      - LOG_LEVEL=INFO
      - JSON_LOGS=true
    depends_on:
      - ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
        limits:
          memory: 4G
          cpus: '2'
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
      - /app/data/vector_store:rw
      - /app/output:rw
      - /app/documents:rw

  # Optional: FastAPI backend for API access
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: runtime
    container_name: pdf-ingest-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - OLLAMA_URL=http://ollama:11434
      - VECTOR_STORE_PATH=/app/data/vector_store
      - LOG_LEVEL=INFO
      - JSON_LOGS=true
    depends_on:
      - ollama
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
      - /app/data/vector_store:rw

volumes:
  ollama_data:
    driver: local