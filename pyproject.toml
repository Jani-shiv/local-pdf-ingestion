[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-ingest"
version = "0.2.0"
description = "Local-first PDF ingestion + RAG: extract, chunk, embed, search, chat — all offline"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Shiv Jani", email = "jani.shiv@example.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "requests>=2.31",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "tqdm>=4.66",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-magic>=0.4.27",
    "trafilatura>=1.9",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6",
    "pillow>=10.0",
    "pytesseract>=0.3",
    "rank-bm25>=0.2",
    "tenacity>=8.2",
    "httpx>=0.27",
    "chromadb>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.5",
    "mypy>=1.10",
]
web = [
    "streamlit>=1.35",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12.0",
]
audio = [
    "faster-whisper>=1.0",
    "torch>=2.3",
    "torchaudio>=2.3",
]
ocr = [
    "paddleocr>=2.7",
]
all = [
    "pdf-ingest[web,audio,ocr]",
]

[project.scripts]
pdf-ingest = "pdf_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E", "F", "I", "UP", "B", "C4", "ANN", "T20", "PT", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "SIM", "TCH", "ARG", "PTH", "NPY", "RUF", "ASYNC", "LOG", "PIE", "TD", "DTZ", "RET", "EXE", "ISC", "ICN", "COM", "PERF", "FURB", "AIR", "TID"]
lint.ignore = [
    # Trailing comma rule conflicts with ruff formatter
    "COM812",
    # Line length is handled by formatter or relaxed
    "E501",
    # Loop variable overwrite is idiomatic in data parsing / cleaning loops
    "PLW2901",
    # Using global for singleton instances in FastAPI is standard pattern
    "PLW0603",
    # FastAPI File(...) default parameter pattern
    "B008",
    # Blocking sync calls in async handler (tmp_path.unlink)
    "ASYNC240",
    # Return within try block is cleaner and avoids redundant else nesting
    "TRY300",
    # Unused function arguments are common in overrides / callbacks
    "ARG001", "ARG002", "ARG005",
    # Long error messages in raise – common in user-facing CLIs
    "TRY003",
    # Single-line if collapses are a readability choice
    "SIM102",
    # os.path vs pathlib – mixed codebases are fine
    "PTH118", "PTH123",
    # Broad exception in tests
    "PT011",
    # Regex match string in pytest.raises
    "RUF043",
    # --- Complexity thresholds: existing code is well-structured ---
    # Too many arguments / positional arguments (PLR0913, PLR0917)
    "PLR0913", "PLR0917",
    # Too many branches (PLR0912)
    "PLR0912",
    # Too many statements (PLR0915)
    "PLR0915",
    # --- Type annotation rules: opt-in improvements only ---
    # Missing annotations on function args / *args / **kwargs / return
    "ANN001", "ANN002", "ANN003", "ANN201", "ANN202",
    # typing.Any in annotations is unavoidable in generic helpers
    "ANN401",
    # --- Magic values: HTTP status codes are universally understood constants ---
    "PLR2004",
    # --- Import placement: lazy/conditional imports are intentional here ---
    "PLC0415",
    # --- Performance micro-optimisations: readability first ---
    "PERF401", "PERF402",
    # --- Datetime timezone: existing code handles PDF date parsing ---
    "DTZ007",
    # --- Logging: existing log.exception style is consistent ---
    "TRY401",
]
format.quote-style = "double"

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = false
strict_optional = false
ignore_missing_imports = true
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"