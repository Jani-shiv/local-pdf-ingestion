[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-ingest"
version = "0.2.0"
description = "Local-first PDF ingestion + RAG: extract, chunk, embed, search, chat — all offline"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Shiv Jani", email = "jani.shiv@example.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "requests>=2.31",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "tqdm>=4.66",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-magic>=0.4.27",
    "trafilatura>=1.9",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6",
    "pillow>=10.0",
    "pytesseract>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.5",
    "mypy>=1.10",
]
web = [
    "streamlit>=1.35",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12.0",
]
audio = [
    "faster-whisper>=1.0",
    "torch>=2.3",
    "torchaudio>=2.3",
]
ocr = [
    "paddleocr>=2.7",
]
all = [
    "pdf-ingest[web,audio,ocr]",
]

[project.scripts]
pdf-ingest = "pdf_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E", "F", "I", "UP", "B", "C4", "ANN", "T20", "PT", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "SIM", "TCH", "ARG", "PTH", "NPY", "RUF", "ASYNC", "LOG", "PIE", "TD", "DTZ", "RET", "EXE", "ISC", "ICN", "COM", "PERF", "FURB", "AIR", "TID"]
lint.ignore = ["ANN101", "ANN102", "ARG001", "ARG002", "TRY003", "SIM102", "PTH118", "PTH123"]
format.quote-style = "double"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"